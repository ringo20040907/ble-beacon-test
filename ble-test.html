
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BLE動作確認</title>
  <style>
    body {
      font-family: sans-serif;
      padding: 20px;
      background: #f5f5f5;
    }
    button {
      padding: 12px 20px;
      font-size: 16px;
    }
    #result {
      background: white;
      padding: 15px;
      margin-top: 20px;
      border-radius: 8px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
  </style>
</head>
<body>

  <h2>BLEビーコン動作確認</h2>

  <p id="status">確認待ち</p>

  <button onclick="checkBLE()">BLE対応状況を確認</button>

  <div id="result">ここに確認結果が表示されます。</div>

  <script>
    async function checkBLE() {
      const result = document.getElementById("result");
      const status = document.getElementById("status");

      result.textContent = "";
      status.textContent = "確認中...";

      result.textContent +=
        "HTTPS環境: " + window.isSecureContext + "\n";

      result.textContent +=
        "Bluetooth API: " +
        ("bluetooth" in navigator) + "\n";

      result.textContent +=
        "BLE広告スキャンAPI: " +
        (typeof navigator.bluetooth?.requestLEScan === "function")
        + "\n";

      if (!window.isSecureContext) {
        result.textContent +=
          "\nHTTPS環境ではありません。HTTPSで開いてください。";
      }

      if (!navigator.bluetooth) {
        result.textContent +=
          "\nWeb Bluetooth APIが利用できません。";
      } else if (!navigator.bluetooth.requestLEScan) {
        result.textContent +=
          "\n広告スキャン機能が利用できません。";
      } else {
        result.textContent +=
          "\nBLE広告スキャンAPIが見つかりました！";
      }

      status.textContent = "確認完了";
    }
  </script>

</body>
</html>
